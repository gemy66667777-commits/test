<header class="hdr" id="hdr">
  <div class="wrap hdr__in">

    <nav class="nav" id="nav">

    <div class="hdr__act">
      <button class="icon-btn lang-btn" id="langBtn" aria-label="Switch language"><span id="langTxt">EN</span></button>
      <button class="icon-btn" id="cartBtn" aria-label="سلة المشتريات">

    </div>
  </div>

<main>

<section class="hero">
  <div class="wrap hero__in">
    <div class="hero__copy">
      <span class="eyebrow eyebrow--start" data-t="heroKicker"></span>
      <h1 class="hero__title"><span data-t="heroTitle"></span><em data-t="heroTitleEm"></em></h1>
      <p class="hero__lead" data-t="heroLead"></p>
      <div class="hero__cta">
        <a href="#shop" class="btn btn--ink" data-t="heroCta1"></a>
        <a href="#story" class="btn btn--line" data-t="heroCta2"></a>
      </div>
      <div class="hero__meta">
        <div><svg viewBox="0 0 24 24" fill="none"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> <span data-t="heroM1"></span></div>
        <div><svg viewBox="0 0 24 24" fill="none"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> <span data-t="heroM2"></span></div>
        <div><svg viewBox="0 0 24 24" fill="none"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> <span data-t="heroM3"></span></div>
      </div>
    </div>

    <div class="hero__shot">
      <img src="assets/img/hero.jpg" alt="عارضة تحمل باليت ظلال باهية" fetchpriority="high">
      <div class="hero__tag">
        <b data-t="heroTagName"></b>
        <span data-t="heroTagNote"></span>
      </div>
    </div>
  </div>
</section>

<section class="section" id="shop">
  <div class="wrap">
    <div class="head">
      <span class="eyebrow eyebrow--start" data-t="shopKicker"></span>
      <h2 class="h-sec" data-t="shopTitle"></h2>
      <p class="p-sec" data-t="shopLead"></p>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="أقسام المتجر"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="section section--tint" id="story">
  <div class="wrap head head--center">
    <span class="eyebrow" data-t="storyKicker"></span>
    <h2 class="h-sec" data-t="storyTitle"></h2>
    <p class="p-sec" style="margin-inline:auto">
      بدأت <strong>باهية</strong> من سؤال بسيط: لماذا تشتري المرأة العربية درجاتٍ صُمّمت لبشرة غيرها؟
      فاخترنا أن نبدأ من الدرجة الصحيحة — أساسٌ يذوب في البشرة الحنطية،
      ودرجات شفاه دافئة، وظلال تليق بالعين الواسعة. كل قطعة نختبرها قبل أن نطرحها،
      ولا نطرح لوناً لا نستخدمه بأنفسنا.
    </p>
  </div>
</section>

<section class="section" id="perks">
  <div class="wrap">
    <div class="head head--center">
      <span class="eyebrow" data-t="perksKicker"></span>
      <h2 class="h-sec" data-t="perksTitle"></h2>
    </div>
    <div class="perks" id="perks"></div>
  </div>
</section>

<section class="cta" id="contact">
  <div class="wrap">
    <span class="eyebrow" data-t="ctaKicker"></span>
    <h2 data-t="ctaTitle"></h2>
    <p data-t="ctaBody"></p>
    <a class="btn btn--wa" id="ctaWa">

      <span data-t="ctaBtn"></span>
    </a>
  </div>
</section>
